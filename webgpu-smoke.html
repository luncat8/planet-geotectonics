<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGPU smoke · planet-geotectonics</title>
<!-- webgpu-smoke.html - double-click in a real browser (no build, no server, file:// ok).
     Boots the GPU engine exactly like index.html does, runs a short CPU/GPU parity
     stretch, exercises the timestamp pipeline and every map layer, and writes the
     full report below. The first two lines are the environment: one short header from
     js/env.js (date to the minute, browser, OS/CPU type) and the GPU as a type plus one
     vendor word - a capture never carries a UA string or an adapter model.
     "Save log" downloads it as webgpu-smoke-<date>-<time>.log - drop that file into
     experiments/logs/ and tell the next agent session its name. -->
<style>
body { font: 13px/1.5 ui-monospace, Consolas, monospace; background: #10141d; color: #cdd6e4; margin: 16px; }
h1 { font-size: 15px; margin: 0 0 8px; }
pre#log { white-space: pre-wrap; word-break: break-word; background: #0b0e15; border: 1px solid #263043;
	padding: 10px; max-height: 60vh; overflow: auto; }
.ok { color: #7fd6a4; } .bad { color: #e07070; }
button { margin-right: 8px; padding: 4px 12px; }
#map { display: block; margin-top: 10px; image-rendering: pixelated; width: 256px; height: 128px; }
</style>
</head>
<body>
<h1>WebGPU smoke · planet-geotectonics</h1>
<button id="save">Save log</button><button id="copy">Copy log</button>
<pre id="log">starting…</pre>
<canvas id="map" width="256" height="128"></canvas>
<script src="js/env.js"></script>
<script src="js/geodesics.js"></script>
<script src="js/params.js"></script>
<script src="js/quat.js"></script>
<script src="js/mantle.js"></script>
<script src="js/diag.js"></script>
<script src="js/state.js"></script>
<script src="js/columns.js"></script>
<script src="js/edges.js"></script>
<script src="js/plates.js"></script>
<script src="js/contact.js"></script>
<script src="js/column-update.js"></script>
<script src="js/surface.js"></script>
<script src="js/events.js"></script>
<script src="js/checkpoint.js"></script>
<script src="js/perf.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/gpu/wgsl-common.js"></script>
<script src="js/gpu/wgsl-columns.js"></script>
<script src="js/gpu/wgsl-scan.js"></script>
<script src="js/gpu/wgsl-mantle.js"></script>
<script src="js/gpu/wgsl-plates.js"></script>
<script src="js/gpu/wgsl-edges.js"></script>
<script src="js/gpu/wgsl-contact.js"></script>
<script src="js/gpu/wgsl-column.js"></script>
<script src="js/gpu/wgsl-surface.js"></script>
<script src="js/gpu/wgsl-diag.js"></script>
<script src="js/gpu/sim-gpu.js"></script>
<script src="js/gpu/render-gpu.js"></script>
<script src="js/gpu/d1diff.js"></script>
<script src="js/clipboard.js"></script>
<script>
'use strict';
var LOG = [], errors = [], failures = [];
function say(line) { LOG.push(line); document.getElementById('log').textContent = LOG.join('\n'); }
function note(tag, line) { say('[' + tag + '] ' + line); }
function fail(line) { say('[FAIL] ' + line); failures.push(line); }
// Every console.error line (Dawn reports WebGPU validation errors there too) goes into the log.
var consoleError = console.error;
console.error = function () {
	var line = Array.prototype.map.call(arguments, function (a) {
		return a && a.stack ? a.stack : String(a);
	}).join(' ');
	errors.push(line);
	consoleError.apply(console, arguments);
};
window.addEventListener('error', function (e) { errors.push('pageerror: ' + e.message); });
window.addEventListener('unhandledrejection', function (e) { errors.push('unhandledrejection: ' + e.reason); });

// One short line per capture, built by js/env.js: date to the minute, browser, OS/CPU type,
// then the GPU as a type plus one vendor word. No UA string, no adapter model, no seconds.
function captureLine(adapter, fallback) {
	return 'gpu ' + Env.gpu(adapter, fallback)
		+ ' · ts-query ' + (adapter.features.has('timestamp-query') ? 'yes' : 'no');
}

(async function () {
	note('boot', Env.line());
	if (!navigator.gpu) { fail('navigator.gpu missing - open in a browser with WebGPU (Chrome 113+/Firefox 141+)'); return finish(); }

	var t0 = Date.now();
	var adapter = await navigator.gpu.requestAdapter({ forceFallbackAdapter: false });
	var usedFallback = false;
	if (!adapter) { adapter = await navigator.gpu.requestAdapter({ forceFallbackAdapter: true }); usedFallback = true; }
	if (!adapter) { fail('no adapter at all'); return finish(); }
	note('boot', captureLine(adapter, usedFallback));

	// Two identical worlds from the same seed: CPU reference and GPU run.
	var level = Params.level, seed = Params.seed, dt = 0.1;
	var cpu = new State(new Grid(level, seed).build(), seed);
	var gpu = new State(new Grid(level, seed).build(), seed);
	cpu.reset(seed); gpu.reset(seed);
	cpu.ckptCap = 0; gpu.ckptCap = 0;
	Sim.raster(cpu);
	// Do not CPU-raster the GPU world: GpuSim.raster is Sim.raster's twin, and a
	// second raster on already-classified edges feeds slab/collision into boot
	// forces the CPU pass never saw (D1 INPUTS: wEq off by ~cm/yr at boot).

	var S = await GpuSim.init(gpu, { fallback: false });
	note('init', 'GpuSim.init ok in ' + S.built + ' ms, tsOn=' + GpuSim.S.tsOn +
		', queries=' + (GpuSim.S.ts ? GpuSim.S.ts.count : 0));
	var device = GpuSim.S.device;
	// GPUUncapturedErrorEvent carries the message on .error, not on the event itself -
	// reading e.message logs "undefined" and throws the only useful detail away.
	device.onuncapturederror = function (e) {
		errors.push('webgpu uncaptured: ' + ((e.error && e.error.message) || e.message || JSON.stringify(e)));
	};
	device.lost.then(function (info) { if (info.reason) errors.push('device lost: ' + info.message); });
	if (!GpuSim.S.tsOn) note('init', 'timestamp-query not available - per-kernel timing off (not a failure)');
	GpuSim.raster(gpu);
	await GpuSim.download(gpu);

	// Defect D1, checkpoint 1: the cross-engine layer diff at boot. Both engines
	// have reduced once with dt = tau_omega, so a divergence already here is
	// inputs/accumulation/solve, not dynamics. The K10 witness line below only
	// proves the device is self-consistent; this compares its intermediates
	// against the CPU's. M/rhs ship divided by A0[0]; D1Diff rescales them.
	var d1boot = D1Diff.compare(cpu, gpu);
	D1Diff.lines(d1boot, 'boot').forEach(function (l) { say(l); });
	D1Diff.failures(d1boot, 'boot').forEach(fail);

	// Phase 1: five frames without an event boundary - the parity stretch.
	Sim.step(cpu, dt); Sim.step(cpu, dt); Sim.step(cpu, dt); Sim.step(cpu, dt); Sim.step(cpu, dt);
	await GpuSim.play(gpu, dt, 5);
	await GpuSim.download(gpu);
	var V = cpu.grid.V, V3 = cpu.grid.pos, ownerBad = 0, zMax = 0;
	for (var c = 0; c < V; c++) {
		if (cpu.owner[c] !== gpu.owner[c]) ownerBad++;
		var dz = Math.abs(cpu.z[c] - gpu.z[c]); if (dz > zMax) zMax = dz;
	}
	note('parity', 'frame 5 dt ' + dt + ' · n cpu=' + cpu.n + ' gpu=' + gpu.n + ' · plates cpu=' +
		cpu.plateCount + ' gpu=' + gpu.plateCount + ' · owner mismatch ' + ownerBad + '/' + V +
		' · |dz| max ' + zMax.toFixed(1) + ' m');
	note('parity', 'meanSpeed cpu=' + (cpu.meanSpeed / 10000).toFixed(3) + ' gpu=' +
		(gpu.meanSpeed / 10000).toFixed(3) + ' cm/yr · maxSpeed cpu=' + (cpu.maxSpeed / 10000).toFixed(3) +
		' gpu=' + (gpu.maxSpeed / 10000).toFixed(3) + ' cm/yr');
	if (ownerBad > V * 0.005) fail('owner mismatch too high: ' + ownerBad + '/' + V);
	if (Math.abs(cpu.plateCount - gpu.plateCount) > 2) fail('plate count drift ' + cpu.plateCount + ' vs ' + gpu.plateCount);
	// When the aggregate below trips, the mean alone cannot say why. This is the
	// discriminator: the worst per-plate rotation-rate difference, and the same mean/max
	// computed from the CPU's *unrelaxed* target omega. If the GPU's numbers land on the
	// target line instead of the measured one, the omega relaxation is the suspect.
	var worstOmega = 0, worstPlate = -1, tgtSum = 0, tgtMax = 0, tgtN = 0;
	for (var p = 0; p < Math.min(cpu.plateCount, gpu.plateCount); p++) {
		var w = p * 3, dOmega = Math.abs(Math.hypot(cpu.omega[w], cpu.omega[w + 1], cpu.omega[w + 2])
			- Math.hypot(gpu.omega[w], gpu.omega[w + 1], gpu.omega[w + 2])) * Params.radius;
		if (dOmega > worstOmega) { worstOmega = dOmega; worstPlate = p; }
	}
	for (var tc = 0; tc < V; tc++) {
		var to = cpu.owner[tc];
		if (to < 0) continue;
		var tp = cpu.plate[to];
		if (tp >= cpu.plateCount) continue;
		var tw = tp * 3, tb = tc * 3, R = Params.radius;
		var tvx = R * (cpu.omegaTarget[tw + 1] * V3[tb + 2] - cpu.omegaTarget[tw + 2] * V3[tb + 1]);
		var tvy = R * (cpu.omegaTarget[tw + 2] * V3[tb] - cpu.omegaTarget[tw] * V3[tb + 2]);
		var tvz = R * (cpu.omegaTarget[tw] * V3[tb + 1] - cpu.omegaTarget[tw + 1] * V3[tb]);
		var tsp = Math.sqrt(tvx * tvx + tvy * tvy + tvz * tvz);
		tgtSum += tsp; tgtN++; if (tsp > tgtMax) tgtMax = tsp;
	}
	// The decisive pair: each engine's OWN |omega| / |omegaTarget|, averaged over the
	// plates. ~1.0 on the device means the relaxation is not running there; a ratio
	// matching the CPU's means omega is fine and the gap is in the aggregate, not the
	// rotation. Both engines relax with alpha = dt / tau_omega, so the two must agree.
	var cpuR = 0, gpuR = 0, nRatio = 0, table = '';
	for (var rp = 0; rp < Math.min(cpu.plateCount, gpu.plateCount); rp++) {
		var rw = rp * 3;
		var wc = Math.hypot(cpu.omega[rw], cpu.omega[rw + 1], cpu.omega[rw + 2]);
		var tc = Math.hypot(cpu.omegaTarget[rw], cpu.omegaTarget[rw + 1], cpu.omegaTarget[rw + 2]);
		var wg = Math.hypot(gpu.omega[rw], gpu.omega[rw + 1], gpu.omega[rw + 2]);
		var tg = Math.hypot(gpu.omegaTarget[rw], gpu.omegaTarget[rw + 1], gpu.omegaTarget[rw + 2]);
		if (!(tc > 0) || !(tg > 0)) continue;
		cpuR += wc / tc; gpuR += wg / tg; nRatio++;
		if (rp < 4) table += ' · p' + (rp + 1) + ' cpu ' + (wc / tc).toFixed(3) + ' gpu ' + (wg / tg).toFixed(3);
	}
	note('parity', 'omega relaxation: mean |omega|/|omegaTarget| cpu ' + (cpuR / Math.max(1, nRatio)).toFixed(3)
		+ ' gpu ' + (gpuR / Math.max(1, nRatio)).toFixed(3) + ' over ' + nRatio + ' plates' + table);
	note('parity', 'omega: worst |dR*w| plate ' + (worstPlate + 1) + ' = ' + (worstOmega / 10000).toFixed(3)
		+ ' cm/yr · cpu from relaxed omega ' + (cpu.meanSpeed / 10000).toFixed(3) + '/' + (cpu.maxSpeed / 10000).toFixed(3)
		+ ' · cpu from target omega ' + (tgtSum / Math.max(1, tgtN) / 10000).toFixed(3) + '/' + (tgtMax / 10000).toFixed(3)
		+ ' · gpu ' + (gpu.meanSpeed / 10000).toFixed(3) + '/' + (gpu.maxSpeed / 10000).toFixed(3));
	// Defect D1's own witnesses, reported by the device instead of inferred from the mirror:
	// reduceB leaves one residual per plate (stored omega minus the omega the relaxation
	// formula predicts) and diagB folds it, then reports the dt and alpha the same frame ran
	// with. Together with the ratios above this closes every branch the code reading left
	// open - the aggregate can only differ from the CPU's for one of these reasons.
	// The device stores f32, so the expectation has to be the f32 of what the JS uploaded:
	// 0.1 arrives as 0.10000000149011612 and a f64 comparison at 1e-6 would fail on the
	// format, not on the physics.
	var wantAlpha = Math.min(1, dt / Params.tauOmega), lag = gpuR / Math.max(1, nRatio);
	note('parity', 'device K10: dt ' + (+gpu.gpuDt).toFixed(6) + ' (uploaded ' + dt + ') · alpha '
		+ (+gpu.gpuAlpha).toFixed(6) + ' (expected ' + wantAlpha.toFixed(6) + ') · worst |stored - relaxed| omega '
		+ (+gpu.gpuRelaxErr).toExponential(2) + ' rad/Myr');
	if (!(Math.abs(gpu.gpuDt - Math.fround(dt)) < 1e-6)) fail('device ran dt ' + gpu.gpuDt + ', the JS uploaded ' + dt);
	if (!(Math.abs(gpu.gpuAlpha - Math.fround(wantAlpha)) < 1e-6)) fail('device alpha ' + gpu.gpuAlpha
		+ ' != min(1, dt/tauOmega) ' + wantAlpha);
	if (!(gpu.gpuRelaxErr < 1e-5)) fail('stored omega is not the relaxed omega (worst residual '
		+ gpu.gpuRelaxErr + ' rad/Myr)');
	// Checkpoint 2: the same layer diff after five relaxed frames. If M/rhs/fit
	// agree here but omega diverges, it is the relaxation history, and the boot
	// table above decides whether the history was wrong from the start.
	var d1f5 = D1Diff.compare(cpu, gpu);
	D1Diff.lines(d1f5, 'frame 5').forEach(function (l) { say(l); });
	D1Diff.failures(d1f5, 'frame 5').forEach(fail);
	if (Math.abs(cpu.meanSpeed - gpu.meanSpeed) > 0.2 * Math.max(1, Math.abs(cpu.meanSpeed))) {
		fail('meanSpeed drift > 20% (cpu ' + (cpu.meanSpeed / 10000).toFixed(3) + ' vs gpu '
			+ (gpu.meanSpeed / 10000).toFixed(3) + ' cm/yr)');
		// The cross-engine diff names the layer the divergence lives in. A witness
		// that recomputes the device's own formula cannot do this (it is
		// self-consistent with a wrong fit), which is what the ratio line used to be.
		if (d1f5.layer) {
			fail('D1: 20% gate tripped - the layer diff names ' + d1f5.layer.toUpperCase()
				+ ' (see the D1 frame 5 table above); that is the next decision point');
		} else {
			fail('D1: 20% gate tripped but every cross-engine layer agrees within '
				+ D1Diff.THRESH + ' relative (device ratio ' + lag.toFixed(3) + ', cpu '
				+ (cpuR / Math.max(1, nRatio)).toFixed(3) + '); the drift is sub-threshold '
				+ 'accumulation across frames, not a named layer - the gate is not widened');
		}
	}

	// Phase 2: fifteen more frames - crosses the t=1 Myr event cycle (download+cycle+upload).
	// A throw here is reported and the run continues: the remaining phases do not need the
	// mirror, and a capture that stops at the first failure wastes the whole trip to a rig.
	var roundTripOk = true;
	try {
		await GpuSim.play(gpu, dt, 15);
		await GpuSim.download(gpu);
	} catch (e) {
		roundTripOk = false;
		fail('event round trip threw: ' + ((e && e.message) || e));
	}
	var finite = roundTripOk && Number.isFinite(gpu.meanSpeed + gpu.maxSpeed + gpu.plateCount) && gpu.n > 0;
	note('events', 'frame 20 t=' + gpu.t.toFixed(1) + ' Myr · plates ' + gpu.plateCount +
		' · columns ' + gpu.n + ' · finite=' + finite);
	if (!finite) fail('GPU state not finite after the event cycle');

	// Phase 3: timestamp pipeline (the ring the buggy usage used to break).
	var tsWall = Date.now();
	await GpuSim.tsCollect();
	note('ts', 'tsCollect ' + (Date.now() - tsWall) + ' ms · ' + (GpuSim.tsReport() || 'no kernel timing'));

	// Phase 4: the GPU renderer over every layer, pixel-compared against the CPU renderer.
	// A layer id routed into the wrong WGSL branch shows up here as a pixel delta, which
	// drawing-and-eyeballing (the old phase 4) never caught. The pixels come out of the
	// renderer's own world texture, never out of the canvas: a real swapchain texture does
	// not carry COPY_SRC (Chrome/D3D picks its usage itself), so a copy from
	// getCurrentTexture() fails validation on hardware and leaves the comparison empty.
	// The loop draws the world texture only - no canvas blit in it - so the parity itself
	// never touches the presentation path; the map below gets one blit at the end.
	var layers = ['plate', 'type', 'z', 'damage', 'owner', 'sediment', 'speed', 'age', 'force', 'dir',
		'oVms', 'oMaf', 'oArc', 'oOro', 'oBas', 'oPla'];
	// The rig builds its own readback path, and a throw in it must not take phases 1-3 down
	// with the rest of the run: the report is the deliverable, so it gets written either way.
	var renderer = null, rendererErr = null;
	try {
		renderer = new GpuRenderer(document.getElementById('map')).init(gpu, { readback: true });
	} catch (e) { rendererErr = e; }
	var ref = new Renderer(document.createElement('canvas'), gpu);
	var gw = renderer ? renderer.canvas.width : 0, gh = renderer ? renderer.canvas.height : 0;
	var row = renderer ? renderer.readRow : 0, bgra = renderer && renderer.format === 'bgra8unorm';
	var wantBytes = row * gh, cpx = ref.image.data, wantCpu = gw * gh * 4;
	var readbackOk = !rendererErr && renderer && renderer.world && wantBytes > 0
		&& cpx && cpx.length === wantCpu;
	if (rendererErr) {
		fail('renderer readback init threw: ' + ((rendererErr && rendererErr.stack) || rendererErr));
	} else if (!readbackOk) {
		fail('pixel parity cannot run: canvas ' + gw + 'x' + gh + ' · readback '
			+ (renderer && renderer.world ? wantBytes + ' bytes' : 'texture missing')
			+ ' · cpu reference ' + (cpx ? cpx.length : 'none') + ' of ' + wantCpu + ' bytes');
	}
	note('render', 'canvas ' + gw + 'x' + gh + ' · format ' + (renderer ? renderer.format : 'none')
		+ ' · row ' + row + ' · readback ' + wantBytes + ' B · cpu ref ' + (cpx ? cpx.length : 0) + ' B');
	// The closing line counts layers that actually compared pixels, not layers
	// the rig was created for: 0.3-6 printed "pixel-parity checked" beside 16 x
	// "readback short" because it keyed off the rig existing.
	var comparedLayers = 0;
	for (var l = 0; readbackOk && l < layers.length; l++) {
		renderer.redraw(layers[l]);
		ref.draw(layers[l]);
		var gpx = null;
		try {
			gpx = await renderer.readPixels();
		} catch (e) {
			fail('readback threw on layer ' + layers[l] + ': ' + ((e && e.message) || e));
			continue;
		}
		if (gpx.length < wantBytes) {
			fail('readback short on layer ' + layers[l] + ': ' + gpx.length + ' of ' + wantBytes + ' bytes');
			continue;
		}
		// Both sides are counted, not assumed: mean|d| divides by the samples actually
		// compared, and a zero count is its own failure. A NaN or a 0/0 mean used to read as
		// "nothing differs" because every comparison against NaN is false.
		var sum = 0, worst = 0, loud = 0, samples = 0;
		for (var y = 0; y < gh; y++) {
			// 'dir' builds its tangent basis per pixel from lon/lat while the CPU renderer
			// builds it per cell: at the poles the east direction spins within one cell, so
			// the caps are the CPU undersampling, not a GPU fault - skip them there.
			var polar = layers[l] === 'dir' && (y < gh * 0.06 || y > gh * 0.94);
			for (var x = 0; x < gw; x++) {
				if (polar) continue;
				var o = y * row + x * 4, q = (y * gw + x) * 4;
				for (var k = 0; k < 3; k++) {
					var gv = gpx[o + (bgra ? 2 - k : k)], cv = cpx[q + k];
					var d = gv > cv ? gv - cv : cv - gv;
					sum += d; samples++;
					if (d > worst) worst = d;
					if (d > 16) loud++;
				}
			}
		}
		var mean = samples ? sum / samples : NaN;
		if (samples) comparedLayers++;
		note('render', layers[l] + ': mean|d| ' + mean.toFixed(2) + ' max|d| ' + worst
			+ ' ch>16: ' + loud + ' · ' + samples + ' samples');
		if (!samples) fail('pixel parity compared nothing on layer ' + layers[l]);
		else if (!Number.isFinite(mean)) fail('pixel parity is not finite on layer ' + layers[l]);
		else if (mean > 2 || worst > 32) fail('GPU/CPU pixels disagree on layer ' + layers[l]
			+ ': mean|d| ' + mean.toFixed(2) + ' max|d| ' + worst);
	}
	if (renderer) {
		renderer.redraw('dir');
		// One canvas blit, on a drained queue: the parity loop drew the world texture
		// only, so this is the first (and last) presentation of the run.
		await device.queue.onSubmittedWorkDone();
		renderer.present();
		await new Promise(function (r) { setTimeout(r, 300); });
	}
	note('render', 'GPU renderer drew ' + (renderer ? layers.length : 0) + ' layers; pixel-parity actually compared '
		+ comparedLayers + '/' + layers.length
		+ (comparedLayers === layers.length ? ' (map below: dir)'
			: ' - ' + (layers.length - comparedLayers) + ' compared nothing (readback failures above)'));

	finish();
	function finish() {
		note('errors', 'captured console/webgpu errors: ' + errors.length);
		for (var i = 0; i < errors.length; i++) say('  ' + errors[i].split('\n').join('\n  '));
		if (errors.length) fail('webgpu/page errors captured (see above)');
		note('result', failures.length ? 'FAIL (' + failures.length + ')' : 'PASS');
		note('result', 'total wall ' + (Date.now() - t0) + ' ms');
	}
})().catch(function (e) {
	fail('uncaught: ' + (e && e.stack || e));
	note('result', 'FAIL');
});

document.getElementById('save').addEventListener('click', function () {
	var name = 'webgpu-smoke-' + Env.fileStamp() + '.log';
	var link = document.createElement('a');
	link.href = URL.createObjectURL(new Blob([LOG.join('\n')], { type: 'text/plain' }));
	link.download = name;
	link.click();
	URL.revokeObjectURL(link.href);
});
// The log is the deliverable of a trip to the rig, so the copy has to work from file:// too:
// navigator.clipboard is routinely refused there, and a capture retyped by hand is a capture
// with transcription errors in the numbers. The copied log says it was copied, so the paste
// and the on-screen log cannot silently differ.
Clipboard.bind(document.getElementById('copy'), function () {
	say('[log] copied ' + LOG.length + ' lines to the clipboard');
	return LOG.join('\n');
});
</script>
</body>
</html>
