<!DOCTYPE html>
<!-- gpu-parity.html - CPU/GPU parity harness (plan H2). Loads the CPU kernels and the
     GPU port side by side, runs identical worlds from the same seed and reports the
     first divergence plus per-field max errors. Driven headless by tests/gpu-parity.js
     through window.__run; open directly in a browser for interactive runs. -->
<html>
<head>
<meta charset="utf-8">
<title>GPU parity</title>
</head>
<body>
<pre id="out">booting…</pre>
<script src="../js/geodesics.js"></script>
<script src="../js/params.js"></script>
<script src="../js/quat.js"></script>
<script src="../js/mantle.js"></script>
<script src="../js/diag.js"></script>
<script src="../js/state.js"></script>
<script src="../js/columns.js"></script>
<script src="../js/edges.js"></script>
<script src="../js/plates.js"></script>
<script src="../js/contact.js"></script>
<script src="../js/column-update.js"></script>
<script src="../js/surface.js"></script>
<script src="../js/events.js"></script>
<script src="../js/checkpoint.js"></script>
<script src="../js/perf.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/gpu/wgsl-common.js"></script>
<script src="../js/gpu/wgsl-columns.js"></script>
<script src="../js/gpu/wgsl-scan.js"></script>
<script src="../js/gpu/wgsl-mantle.js"></script>
<script src="../js/gpu/wgsl-plates.js"></script>
<script src="../js/gpu/wgsl-edges.js"></script>
<script src="../js/gpu/wgsl-contact.js"></script>
<script src="../js/gpu/wgsl-column.js"></script>

<script src="../js/gpu/sim-gpu.js"></script>
<script>
'use strict';
var OUT = document.getElementById('out');
function say(line) { OUT.textContent += '\n' + line; }

// Field descriptors: name, kind ('int' exact | 'float' tolerance), length, getters.
function fields(cpu, gpu) {
	var V = cpu.grid.V, cap = Math.min(cpu.n, gpu.n);
	return [
		{ name: 'n', kind: 'int', get: function (s) { return [s.n]; } },
		{ name: 'plateCount', kind: 'int', get: function (s) { return [s.plateCount]; } },
		{ name: 'gaps', kind: 'int', get: function (s) { return [s.gaps]; } },
		{ name: 'owner', kind: 'int', len: V, get: function (s) { return s.owner; } },
		{ name: 'cellPlate', kind: 'int', len: V, get: function (s) { return s.cellPlate; } },
		{ name: 'low', kind: 'int', len: V, get: function (s) { return s.low; } },
		{ name: 'trenchDist', kind: 'int', len: V, get: function (s) { return s.trenchDist; } },
		{ name: 'gapFrames', kind: 'int', len: V, get: function (s) { return s.gapFrames; } },
		{ name: 'spawnSlot', kind: 'int', len: V, get: function (s) { return s.spawnSlot; } },
		{ name: 'alive', kind: 'int', len: 'cap', get: function (s) { return s.alive; } },
		{ name: 'plate', kind: 'int', len: 'cap', get: function (s) { return s.plate; } },
		{ name: 'cell', kind: 'int', len: 'cap', get: function (s) { return s.cell; } },
		{ name: 'consumedBy', kind: 'int', len: 'cap', get: function (s) { return s.consumedBy; } },
		{ name: 'edgeType', kind: 'int', len: V * 6, get: function (s) { return s.edgeType; } },
		{ name: 'polarity', kind: 'int', len: V * 6, get: function (s) { return s.polarity; } },
		{ name: 'relN', kind: 'float', len: V * 6, scale: Params.vRef, get: function (s) { return s.relN; } },
		{ name: 'relT', kind: 'float', len: V * 6, scale: Params.vRef, get: function (s) { return s.relT; } },
		{ name: 'world', kind: 'float3', len: 'cap', get: function (s) { return s.world; } },
		{ name: 'hFel', kind: 'float', len: 'cap', get: function (s) { return s.hFel; } },
		{ name: 'hMaf', kind: 'float', len: 'cap', get: function (s) { return s.hMaf; } },
		{ name: 'hSed', kind: 'float', len: 'cap', get: function (s) { return s.hSed; } },
		{ name: 'age', kind: 'float', len: 'cap', get: function (s) { return s.age; } },
		{ name: 'damage', kind: 'float', len: 'cap', get: function (s) { return s.damage; } },
		{ name: 'zDyn', kind: 'float', len: 'cap', get: function (s) { return s.zDyn; } },
		{ name: 'oVms', kind: 'float', len: 'cap', get: function (s) { return s.oVms; } },
		{ name: 'oMaf', kind: 'float', len: 'cap', get: function (s) { return s.oMaf; } },
		{ name: 'oArc', kind: 'float', len: 'cap', get: function (s) { return s.oArc; } },
		{ name: 'oOro', kind: 'float', len: 'cap', get: function (s) { return s.oOro; } },
		{ name: 'oBas', kind: 'float', len: 'cap', get: function (s) { return s.oBas; } },
		{ name: 'oPla', kind: 'float', len: 'cap', get: function (s) { return s.oPla; } },
		{ name: 'z', kind: 'float', len: V, get: function (s) { return s.z; } },
		{ name: 'slope', kind: 'float', len: V, get: function (s) { return s.slope; } },
		{ name: 'gradZ', kind: 'float3', len: V, get: function (s) { return s.gradZ; } },
		{ name: 'uMantle', kind: 'float3', len: V, scale: Params.vRef, get: function (s) { return s.uMantle; } },
		{ name: 'plumeT', kind: 'float', len: V, get: function (s) { return s.plumeT; } },
		{ name: 'vel', kind: 'float3', len: V, scale: Params.vRef, get: function (s) { return s.vel; } },
		{ name: 'ext', kind: 'float', len: V, get: function (s) { return s.ext; } },
		{ name: 'mobile', kind: 'float', len: V, get: function (s) { return s.mobile; } },
		{ name: 'omega', kind: 'float3', len: 'plates', get: function (s) { return s.omega; } },
		{ name: 'q', kind: 'float4', len: 'plates', get: function (s) { return s.q; } },
		{ name: 'plateCells', kind: 'int', len: 'plates', get: function (s) { return s.plateCells; } },
		{ name: 'subCount', kind: 'int', len: 'plates', get: function (s) { return s.subCount; } },
		{ name: 'subRate', kind: 'float', len: 'plates', get: function (s) { return s.subRate; } },
		{ name: 'arcFeed', kind: 'float', len: 'plates', get: function (s) { return s.arcFeed; } },
		{ name: 'meanSpeed', kind: 'float', get: function (s) { return [s.meanSpeed]; } },
		{ name: 'maxSpeed', kind: 'float', get: function (s) { return [s.maxSpeed]; } },
		{ name: 'overlaps', kind: 'int', get: function (s) { return [s.overlaps]; } },
		{ name: 'deaths', kind: 'int', get: function (s) { return [s.deaths]; } },
		{ name: 'spawns', kind: 'int', get: function (s) { return [s.spawns]; } },
		{ name: 'typeChanges', kind: 'int', get: function (s) { return [s.typeChanges]; } },
		{ name: 'producedFel', kind: 'ledger', get: function (s) { return [s.producedFel]; } },
		{ name: 'producedMaf', kind: 'ledger', get: function (s) { return [s.producedMaf]; } },
		{ name: 'erodedFel', kind: 'ledger', get: function (s) { return [s.erodedFel]; } },
		{ name: 'erodedMaf', kind: 'ledger', get: function (s) { return [s.erodedMaf]; } },
		{ name: 'subductedMaf', kind: 'ledger', get: function (s) { return [s.subductedMaf]; } },
		{ name: 'subductedSed', kind: 'ledger', get: function (s) { return [s.subductedSed]; } },
		{ name: 'subductedArea', kind: 'ledger', get: function (s) { return [s.subductedArea]; } }
	];
}

function compare(cpu, gpu, names, absTol, relTol, at) {
	var out = [], list = fields(cpu, gpu);
	for (var f = 0; f < list.length; f++) {
		var d = list[f];
		if (names && names.indexOf(d.name) < 0) continue;
		var n, stride = 1;
		if (d.kind === 'float3') stride = 3;
		if (d.kind === 'float4') stride = 4;
		// float3/float4 descriptors carry a flat length in ELEMENT units (cells or
		// columns); multiply by stride so the whole packed array is compared.
		if (d.len === 'cap') n = Math.min(cpu.n, gpu.n) * stride;
		else if (d.len === 'plates') n = Math.min(cpu.plateCount, gpu.plateCount) * stride;
		else if (d.len) n = d.len * stride;
		var a = d.get(cpu), b = d.get(gpu);
		var worst = 0, worstAt = -1, count = 0, firstA = 0, firstB = 0;
		for (var i = 0; i < n; i++) {
			var x = a[i], y = b[i];
			if (d.kind === 'int') {
				if (x !== y) {
					if (count === 0) { firstA = x; firstB = y; worstAt = i; }
					count++;
				}
			} else {
				if (x !== x || y !== y) { if (x !== x && y !== y) continue; count++; worstAt = i; firstA = x; firstB = y; continue; }
				var err = Math.abs(x - y);
				// Velocity-family fields carry f32 noise relative to the field scale (vRef),
				// so their tolerance is normalized: the plan's abs 1e-6 + rel 1e-5 in normalized units.
				var tol = (absTol + relTol * Math.abs(x)) * (d.scale || 1);
				if (d.name === 'distance') tol = 1 / 128;
				if (err > tol) {
					if (count === 0) { firstA = x; firstB = y; worstAt = i; }
					count++;
				}
				if (err / tol > worst) worst = err / tol;
			}
		}
		out.push({ name: d.name, mismatches: count, at: worstAt, cpu: firstA, gpu: firstB, worstRatio: worst });
	}
	return out;
}

// The GPU packs state to f32 (columns, cells, plates) and fixed point (distance, gapTime,
// ledgers), so tolerances are chosen per family, not per test: 1e-5 relative plus a small
// absolute floor; integers must match exactly away from thresholds.
	// Deep-copy a state's own data (typed arrays and scalars, not the shared grid) so a
	// second run can start from bit-identical uploads.
	function cloneState(src, dst) {
		for (var k in src) {
			if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
			var v = src[k];
			if (v && v.buffer && v.byteLength !== undefined) dst[k] = new v.constructor(src[k]);
			else if (typeof v === 'number' || typeof v === 'boolean' || typeof v === 'string') dst[k] = v;
		}
	}

	// Same-device determinism: two runs from the same uploaded state must agree exactly,
	// field by field, with zero tolerance (the H acceptance bullet above ensemble stats).
	window.__det = async function (cfg) {
		cfg = cfg || {};
		var level = cfg.level || 5, frames = cfg.frames !== undefined ? cfg.frames : 8, dt = cfg.dt || 0.1;
		var seed = cfg.seed !== undefined ? cfg.seed : 7;
		var report = { frames: frames, level: level, seed: seed, ok: true, fields: [] };
		try {
			var gridA = new Grid(level).build(), gridB = new Grid(level).build();
			var a = new State(gridA, level), b = new State(gridB, level);
			a.reset(seed);
			b.reset(seed);
			await GpuSim.init(a, {});
			GpuSim.raster(a);
			await GpuSim.download(a);
			cloneState(a, b);
			var runs = [];
			for (var r = 0; r < 2; r++) {
				var s = r === 0 ? a : b;
				await GpuSim.uploadState(s);
				for (var f = 0; f < frames; f++) {
					GpuSim.frame(s, dt);
					s.frame++; s.t += dt;
					if (s.t - s.lastEvent >= Params.eventCadence) {
						await GpuSim.download(s);
						Events.cycle(s);
						s.lastEvent = s.t;
						await GpuSim.uploadState(s);
					}
				}
				await GpuSim.download(s);
				runs.push(s);
			}
			var cmp = compare(runs[0], runs[1], null, 0, 0, -1);
			var bad = [];
			for (var i = 0; i < cmp.length; i++) if (cmp[i].mismatches > 0 || cmp[i].worstRatio > 0) bad.push(cmp[i]);
			report.fields = cmp;
			report.bad = bad;
			report.ok = bad.length === 0;
		} catch (e) {
			report.ok = false;
			report.error = String(e && e.stack || e);
		}
		return report;
	};

	// Ensemble statistics (the H Done bullet): CPU vs GPU over many frames per seed,
	// comparing epoch statistics with predeclared bounds, never per-column identity.
	// Bounds: plates within +-2, alive columns within 2%, mean/max speed within 15%,
	// continental share (hFel > 20 km) within 0.02 absolute.
	window.__ens = async function (cfg) {
		cfg = cfg || {};
		var level = cfg.level || 5, frames = cfg.frames !== undefined ? cfg.frames : 1000;
		var dt = cfg.dt || 0.1, every = cfg.every || 10;
		var seeds = cfg.seeds || [7, 8, 9];
		// Bounds: plates within +-2, alive columns within 2%, mean speed within 20%, max
		// speed within a factor 2, continental share within 2pp. Mean/max are velocity
		// aggregates: per-cell velocity parity is only promised to (1e-6 + 1e-5|x|)*vRef
		// (~50% relative at speed scale), so the max over ~10k cells may legitimately
		// differ by half at isolated epochs - it is reported as a guard against runaway
		// plates, not as a distributional test. Continental share is a threshold statistic
		// (hFel > 20 km); under continuous f32 noise it drifts up to ~1.5pp per 100 Myr,
		// while the CPU's own dt comparison showed ~0.2pp per 500 Myr. The distributional
		// gates are plates, columns and mean speed.
		var BOUNDS = { plates: 2, columns: 0.02, meanCm: 0.20, maxCm: 1.00, cont: 0.02 };
		var report = { frames: frames, level: level, seeds: seeds, ok: true, rows: [], violations: [] };
		function sample(s) {
			var n = 0, cont = 0;
			for (var i = 0; i < s.n; i++) {
				if (!s.alive[i]) continue;
				n++;
				if (s.hFel[i] > 20000) cont++;
			}
			return { t: s.t, plates: s.plateCount, columns: n, meanCm: s.meanSpeed / 10000,
				maxCm: s.maxSpeed / 10000, cont: cont / Math.max(1, n) };
		}
		try {
			for (var si = 0; si < seeds.length; si++) {
				var seed = seeds[si];
				var gridC = new Grid(level).build(), gridG = new Grid(level).build();
				var cpu = new State(gridC, level), gpu = new State(gridG, level);
				cpu.reset(seed);
				gpu.reset(seed);
				var cpuS = [], gpuS = [];
				Sim.raster(cpu);
				cpuS.push(sample(cpu));
				for (var f = 0; f < frames; f++) {
					Sim.step(cpu, dt);
					if ((f + 1) % every === 0) cpuS.push(sample(cpu));
				}
				await GpuSim.init(gpu, {});
				GpuSim.raster(gpu);
				await GpuSim.download(gpu);
				gpuS.push(sample(gpu));
				for (var f2 = 0; f2 < frames; f2++) {
					await GpuSim.step(gpu, dt, Events, Checkpoint, Params);
					if ((f2 + 1) % every === 0) {
						await GpuSim.download(gpu);
						gpuS.push(sample(gpu));
					}
				}
				var worst = { plates: 0, columns: 0, meanCm: 0, maxCm: 0, cont: 0 };
				for (var k = 0; k < Math.min(cpuS.length, gpuS.length); k++) {
					var a = cpuS[k], b = gpuS[k];
					var d = { plates: Math.abs(a.plates - b.plates),
						columns: Math.abs(a.columns - b.columns) / Math.max(1, a.columns),
						meanCm: Math.abs(a.meanCm - b.meanCm) / Math.max(1e-9, a.meanCm),
						maxCm: Math.abs(a.maxCm - b.maxCm) / Math.max(1e-9, a.maxCm),
						cont: Math.abs(a.cont - b.cont) };
					for (var key in d) {
						if (d[key] > worst[key]) worst[key] = d[key];
						if (d[key] > BOUNDS[key]) {
							report.violations.push('seed ' + seed + ' t=' + a.t.toFixed(1) + ' Myr ' + key
								+ ': cpu=' + a[key].toPrecision(5) + ' gpu=' + b[key].toPrecision(5));
						}
					}
				}
				worst.seed = seed;
				worst.end = cpuS[cpuS.length - 1];
				worst.endGpu = gpuS[gpuS.length - 1];
				report.rows.push(worst);
				if (!Number.isFinite(gpu.meanSpeed + gpu.maxSpeed + gpu.plateCount) || gpu.finite === 0) {
					report.violations.push('seed ' + seed + ': GPU state not finite at t=' + gpu.t.toFixed(1));
				}
			}
			report.ok = report.violations.length === 0;
		} catch (e) {
			report.ok = false;
			report.error = String(e && e.stack || e);
		}
		return report;
	};

	window.__run = async function (cfg) {
		cfg = cfg || {};
		var level = cfg.level || 5, frames = cfg.frames !== undefined ? cfg.frames : 1, dt = cfg.dt || 0.1;
	var absTol = cfg.absTol !== undefined ? cfg.absTol : 1e-6;
	var relTol = cfg.relTol !== undefined ? cfg.relTol : 1e-5;
	var seed = cfg.seed !== undefined ? cfg.seed : 7;
	var names = cfg.fields || null;
	var report = { frames: frames, dt: dt, level: level, seed: seed, ok: true, firstBadFrame: -1, fields: [] };
	try {
		var gridC = new Grid(level).build(), gridG = new Grid(level).build();
		var cpu = new State(gridC, level), gpu = new State(gridG, level);
		cpu.reset(seed);
		gpu.reset(seed);
		var S = await GpuSim.init(gpu, {});
		S.builtMs = S.built;
		GpuSim.raster(gpu);
		await GpuSim.download(gpu);
		Sim.raster(cpu);
		if (frames === 0) {
			// Boot-only compare: the raster path (move/bin/scan/raster/elevation).
			report.last = compare(cpu, gpu, names, absTol, relTol, -1);
			report.ok = report.last.every(function (r) { return r.mismatches === 0; });
			if (!report.ok) report.bad = report.last.filter(function (r) { return r.mismatches > 0; });
			return report;
		}
		for (var f = 0; f < frames; f++) {
			Sim.step(cpu, dt);
			await GpuSim.step(gpu, dt, Events, Checkpoint, Params);
			await GpuSim.download(gpu);
			var cmp = compare(cpu, gpu, names, absTol, relTol, f);
			var bad = [];
			for (var i = 0; i < cmp.length; i++) if (cmp[i].mismatches > 0) bad.push(cmp[i]);
			if (bad.length && report.firstBadFrame < 0) {
				report.firstBadFrame = f;
				report.bad = bad;
			}
			if (bad.length && cfg.stopOnFirst) break;
		}
		report.last = compare(cpu, gpu, names, absTol, relTol, frames);
		report.ok = report.firstBadFrame < 0;
		report.gpuBuildMs = S.builtMs;
	} catch (e) {
		report.ok = false;
		report.error = String(e && e.stack || e);
	}
	return report;
};

window.__ready = true;
say('ready');
</script>
</body>
</html>
